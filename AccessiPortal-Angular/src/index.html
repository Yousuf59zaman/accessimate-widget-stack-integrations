<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <title>AccessiPortal — Next-Gen Accessible Citizen Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Premium Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN for instant rich utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#0c4a6e',
              900: '#082f49',
            },
            accent: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          },
          boxShadow: {
            'glow-sky': '0 0 25px -5px rgba(56, 189, 248, 0.4)',
            'glow-indigo': '0 0 25px -5px rgba(99, 102, 241, 0.4)',
            'glass': '0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 15px 0 rgba(255, 255, 255, 0.5) inset',
          }
        }
      }
    }
  </script>
<!--  -->
  <!-- Accessimate Accessibility Widget Script -->
  <script type="module" src="https://dev-script.accessimate.com/js/main.js" data-account="Lxoe73FIpciPnfBoIFmnwQI4zOOvtGfr67NEwLsp"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-sky-500 selection:text-white overflow-x-hidden">

  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-5 focus:py-3 focus:bg-sky-500 focus:text-white focus:font-bold focus:rounded-xl focus:shadow-2xl focus:outline-none">
    Skip to main content
  </a>

  <app-root></app-root>

</html>
